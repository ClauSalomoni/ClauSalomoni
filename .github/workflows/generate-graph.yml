name: Generate GitHub Profile 3D Contrib Calendar

on:
  schedule:
    - cron: "0 0 * * *" # Executa automaticamente todo dia à meia-noite
  workflow_dispatch: # Permite rodar manualmente no botão sempre que quiser

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v3
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -A .
          git commit -m "generated profile 3d contrib graph" || exit 0
          git push
